  --surface: #0a0a06;
  --surface-2: #100e07;
  --line: #2b2510;
  --line-bright: #57491a;
  --gold: #ffd700;
  --gold-dim: #bfa100;
  --green: #39ff88;
  --cyan: #00ccff;
  --pink: #ff2d9a;
  --orange: #ff9d2d;
  --ink: #f5ecc9;
  --muted: #a2935f;
  --faint: #6f6440;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #050505;
    --surface: #0a0a06;
    --surface-2: #100e07;
    --line: #2b2510;
    --line-bright: #57491a;
    --gold: #ffd700;
    --gold-dim: #bfa100;
    --green: #39ff88;
    --cyan: #00ccff;
    --pink: #ff2d9a;
    --orange: #ff9d2d;
    --ink: #f5ecc9;
    --muted: #a2935f;
    --faint: #6f6440;
  }
}
html,
body {
  background: var(--bg);
}
body {
  font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
}
@keyframes blink {
  0%,
  49% {
    opacity: 1;
  }
  50%,
  100% {
    opacity: 0;
  }
}
.blink {
  animation: blink 1.1s steps(1) infinite;
}
@keyframes scanmove {
  0% {
    background-position: 0 0;
  }
  100% {
    background-position: 0 120px;
  }
}
.scanlines {
  background-image: repeating-linear-gradient(
    0deg,
    rgba(255, 215, 0, 0.025) 0px,
    rgba(255, 215, 0, 0.025) 1px,
    transparent 1px,
    transparent 4px
  );
}
.logbox::-webkit-scrollbar {
  width: 8px;
}
.logbox::-webkit-scrollbar-thumb {
  background: var(--line-bright);
}
.logbox::-webkit-scrollbar-track {
  background: var(--surface);
}
.hover\:bg-\[var\(--surface-2\)\]:hover {
  background-color: var(--surface-2);
}
.hover\:text-\[var\(--gold\)\]:hover {
  color: var(--gold);
}
.enabled\:hover\:bg-\[var\(--surface-2\)\]:hover:enabled {
  background-color: var(--surface-2);
}
.disabled\:opacity-40:disabled {
  opacity: 0.4;
}
@media (min-width: 640px) {
  .sm\:h-\[440px\] {
    height: 440px;
  }
  .sm\:w-64 {
    width: 16rem;
  }
  .sm\:shrink-0 {
    flex-shrink: 0;
  }
  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .sm\:flex-row {
    flex-direction: row;
  }
  .sm\:items-baseline {
    align-items: baseline;
  }
  .sm\:gap-4 {
    gap: 1rem;
  }
  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }
  .sm\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }
  .sm\:py-8 {
    padding-top: 2rem;
    padding-bottom: 2rem;
  }
  .sm\:text-2xl {
    font-size: 1.5rem;
    line-height: 2rem;
  }
  .sm\:text-4xl {
    font-size: 2.25rem;
    line-height: 2.5rem;
  }
  .sm\:text-\[10px\] {
    font-size: 10px;
  }
  .sm\:text-\[11px\] {
    font-size: 11px;
  }
  .sm\:text-base {
    font-size: 1rem;
    line-height: 1.5rem;
  }
  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}
