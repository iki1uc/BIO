  filter: var(--tw-blur) var(--tw-brightness) var(--tw-contrast) var(--tw-grayscale) var(--tw-hue-rotate) var(--tw-invert) var(--tw-saturate) var(--tw-sepia) var(--tw-drop-shadow);
}
:root{
  --bg:#000000;
  --surface:#020602;
  --panel:#031003;
  --panel2:#041a04;
  --line:#00ff00;
  --line-dim:#0a5c0a;
  --green:#00ff00;
  --green-dim:#00cc00;
  --gold:#ffd700;
  --cyan:#00ccff;
  --text:#00ff00;
  --text-dim:#3dd33d;
  --muted:#1a7a1a;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000;
    --surface:#020602;
    --panel:#031003;
    --panel2:#041a04;
    --line:#00ff00;
    --line-dim:#0a5c0a;
    --green:#00ff00;
    --green-dim:#00cc00;
    --gold:#ffd700;
    --cyan:#00ccff;
    --text:#00ff00;
    --text-dim:#3dd33d;
    --muted:#1a7a1a;
  }
}
html,body{
  background:var(--bg);
  color:var(--text);
}
body{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@keyframes blink{
  0%,60%{
    opacity:1
  }
  61%,100%{
    opacity:0
  }
}
@keyframes scan{
  0%{
    transform:translateY(-100%)
  }
  100%{
    transform:translateY(500%)
  }
}
@keyframes glowPulse{
  0%,100%{
    box-shadow:0 0 0 rgba(0,255,0,0)
  }
  50%{
    box-shadow:0 0 22px rgba(0,255,0,.45)
  }
}
.blink{
  animation:blink 1s steps(1) infinite
}
.scanline{
  animation:scan 3.4s linear infinite
}
.glowPulse{
  animation:glowPulse 1.6s ease-in-out infinite
}
.gridBg{
  background-image:linear-gradient(rgba(0,255,0,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,0,.06) 1px,transparent 1px);
  background-size:28px 28px
}
.disabled\:opacity-40:disabled {
  opacity: 0.4;
}
@media (min-width: 640px) {
  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sm\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .sm\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .sm\:px-4 {
    padding-left: 1rem;
    padding-right: 1rem;
  }
  .sm\:px-5 {
    padding-left: 1.25rem;
    padding-right: 1.25rem;
  }
  .sm\:text-sm {
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
  .sm\:text-xl {
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
  .sm\:text-xs {
    font-size: 0.75rem;
    line-height: 1rem;
  }
}
@media (min-width: 1024px) {
  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
